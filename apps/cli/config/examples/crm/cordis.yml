# Source-checkout Web overlay. Run from the repository root.
- id: agent-presets
  config:
    default: crm
    includeShippedRoot: false
    includeUserRoot: false
    roots:
      - path: !!js process.cwd() + '/apps/cli/config/examples/crm/presets'
        trust: system
- insert:
    - id: crm-excel-host
      name: ./crm-excel-host.ts
      config:
        artifactToolModule: !!js process.env.DSH_CRM_ARTIFACT_TOOL_MODULE || 'artifact-tool-unconfigured'
        exportRoot: !!js process.env.DSH_CRM_EXPORT_ROOT || process.cwd() + '/.artifacts/crm-exports'
        ttlMs: 3600000
        maxFiles: 20
    - id: crm-charts
      name: "@deepseek-ai/dsh-client-ui-crm"
    - id: crm-ma-provider
      name: ./ma-http-provider.ts
      config:
        endpoint: !!js process.env.DSH_CRM_MA_URL
        allowHttp: !!js process.env.DSH_CRM_MA_ALLOW_HTTP === 'true'
        allowUnauthenticated: !!js process.env.DSH_CRM_MA_ALLOW_UNAUTHENTICATED === 'true'
        tenantId: mkt
        buCode: catering
        usernameEnv: DSH_CRM_MA_USERNAME
        passwordEnv: DSH_CRM_MA_PASSWORD
        timeoutMs: 30000
        maxResponseBytes: 1048576
    - id: crm-cdp-provider
      name: ./cdp-http-provider.ts
      disabled: !!js process.env.DSH_CRM_CDP_URL === undefined
      config:
        endpoint: !!js process.env.DSH_CRM_CDP_URL
        allowHttp: !!js process.env.DSH_CRM_CDP_ALLOW_HTTP === 'true'
        allowUnauthenticated: !!js process.env.DSH_CRM_CDP_ALLOW_UNAUTHENTICATED === 'true'
        collectionId: mkt_catering_loyalty
        usernameEnv: DSH_CRM_CDP_USERNAME
        passwordEnv: DSH_CRM_CDP_PASSWORD
        timeoutMs: 30000
        maxResponseBytes: 4194304
    - id: crm-loyalty-provider
      name: ./loyalty-http-provider.ts
      config:
        endpoint: !!js process.env.DSH_CRM_LOYALTY_URL
        allowHttp: !!js process.env.DSH_CRM_LOYALTY_ALLOW_HTTP === 'true'
        allowUnauthenticated: !!js process.env.DSH_CRM_LOYALTY_ALLOW_UNAUTHENTICATED === 'true'
        tenantId: mkt
        buCode: catering
        usernameEnv: DSH_CRM_LOYALTY_USERNAME
        passwordEnv: DSH_CRM_LOYALTY_PASSWORD
        timeoutMs: 30000
        maxResponseBytes: 1048576
        couponTemplateIds: []
